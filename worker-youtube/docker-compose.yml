# Worker node: HDFS DataNode + Spark Worker.
# All machine-specific values come from .env (copy .env.example -> .env).
# See docs/LAB_SETUP.md before starting.

services:
  datanode:
    platform: linux/amd64
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"
      - "${DATANODE_PORT:?Set DATANODE_PORT in .env}:${DATANODE_PORT}"
    environment:
      - SERVICE_PRECONDITION=${MASTER_IP:?Set MASTER_IP in .env}:9870
      - CORE_CONF_fs_defaultFS=hdfs://${MASTER_IP}:9000
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:${DATANODE_PORT}
      - HDFS_CONF_dfs_datanode_http_address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_hostname=${WORKER_IP:?Set WORKER_IP in .env}
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    volumes:
      - hadoop_datanode:/hadoop/dfs/data

  spark-worker:
    image: apache/spark:3.5.9-python3
    container_name: spark-worker
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://${MASTER_IP}:7077 --memory 2g --cores 2 --port 7079
    ports:
      - "8081:8081"
      - "7079:7079"
    environment:
      # Bind inside the container on all interfaces; advertise the LAN IP.
      # Do NOT set SPARK_LOCAL_HOSTNAME to the LAN IP - the container can't bind it.
      - SPARK_LOCAL_IP=0.0.0.0
      - SPARK_PUBLIC_DNS=${WORKER_IP}
      - SPARK_WORKER_WEBUI_PORT=8081

volumes:
  hadoop_datanode:
